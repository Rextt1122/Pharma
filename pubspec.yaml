name: smart_greenhouse_pbl
description: "A Smart Greenhouse IoT monitoring application."
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  mqtt_client: ^10.5.0
  syncfusion_flutter_gauges: ^28.2.3
  http: ^1.2.1
  shared_preferences: ^2.2.2
  csv: ^6.0.0
  path_provider: ^2.1.2
  model_viewer_plus: ^1.8.1
  fl_chart: ^1.2.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  ota_update: ^7.1.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/gudang_3d.glb
    - assets/models/coba_refined_v4_1.glb
    - assets/models/model_3d_v2.glb
    - assets/images/
    - assets/images/denah_ruang_vaksin.png
